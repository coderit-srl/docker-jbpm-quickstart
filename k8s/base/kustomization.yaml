apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jbpm

resources:
  # Namespace
  - namespace.yaml

  # Components
  - postgres
  - keycloak
  - jbpm

  # Ingress
  - ingress.yaml

# Common labels for all resources
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jbpm-stack
