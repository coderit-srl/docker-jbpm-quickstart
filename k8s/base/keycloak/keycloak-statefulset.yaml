apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: jbpm
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: jbpm-stack
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: jbpm-stack
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
        - name: realm-init
          image: coderitsrl/jbpm-keycloak:latest
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secret
          volumeMounts:
            - name: keycloak-realms
              mountPath: /opt/keycloak/data/import
              readOnly: true
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Starting Keycloak in background for realm import..."

              # Start Keycloak in the background
              /opt/keycloak/bin/kc.sh start --optimized &
              KC_PID=$!

              # Wait for Keycloak to be ready
              echo "Waiting for Keycloak to start..."
              until curl -sf http://localhost:9080/health/ready > /dev/null 2>&1; do
                sleep 5
                echo "Still waiting for Keycloak..."
              done
              echo "Keycloak is ready"

              # Authenticate with admin credentials
              echo "Authenticating with Keycloak admin..."
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:9080 \
                --realm master \
                --user "$KEYCLOAK_ADMIN" \
                --password "$KEYCLOAK_ADMIN_PASSWORD"

              # Process each realm file
              for realm_file in /opt/keycloak/data/import/*-realm.json; do
                if [ -f "$realm_file" ]; then
                  # Extract realm name from the JSON file
                  REALM_NAME=$(grep -o '"realm"[[:space:]]*:[[:space:]]*"[^"]*"' "$realm_file" | head -1 | sed 's/.*: *"\([^"]*\)".*/\1/')

                  if [ -n "$REALM_NAME" ]; then
                    echo "Checking if realm '$REALM_NAME' exists..."

                    # Check if realm already exists
                    if /opt/keycloak/bin/kcadm.sh get realms/"$REALM_NAME" > /dev/null 2>&1; then
                      echo "Realm '$REALM_NAME' already exists, skipping import"
                    else
                      echo "Realm '$REALM_NAME' does not exist, importing..."
                      /opt/keycloak/bin/kcadm.sh create realms -f "$realm_file"
                      echo "Realm '$REALM_NAME' imported successfully"

                      # Import users if corresponding file exists
                      users_file="/opt/keycloak/data/import/${REALM_NAME}-users-0.json"
                      if [ -f "$users_file" ]; then
                        echo "Importing users for realm '$REALM_NAME'..."
                        /opt/keycloak/bin/kcadm.sh create partialImport -r "$REALM_NAME" \
                          -s ifResourceExists=SKIP \
                          -f "$users_file"
                        echo "Users imported successfully"
                      fi
                    fi
                  fi
                fi
              done

              echo "Realm initialization complete, shutting down init Keycloak..."
              kill $KC_PID 2>/dev/null || true
              wait $KC_PID 2>/dev/null || true
              echo "Init container completed successfully"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      containers:
        - name: keycloak
          image: coderitsrl/jbpm-keycloak:latest
          args:
            - start
          ports:
            - containerPort: 9080
              name: http
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: keycloak-realms
          configMap:
            name: keycloak-realms
