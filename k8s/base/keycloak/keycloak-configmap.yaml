apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: jbpm
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: jbpm-stack
data:
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
  KC_HOSTNAME: keycloak.example.com
  KC_HTTP_ENABLED: "true"
  KC_HTTP_PORT: "9080"
  KC_PROXY: edge
