apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: jbpm
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: jbpm-stack
type: Opaque
stringData:
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: keycloak
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin
