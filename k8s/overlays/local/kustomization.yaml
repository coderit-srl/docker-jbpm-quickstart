apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jbpm

resources:
  - ../../base

# Generate environment-specific ConfigMaps
configMapGenerator:
  - name: keycloak-realms
    files:
      - jbpm-realm.json
      - jbpm-users-0.json
  - name: jbpm-kie-git
    files:
      - kie-git.json

# Generate environment-specific Secrets
secretGenerator:
  - name: jbpm-cli-scripts
    files:
      - custom.cli
      - jbpm-keycloak-setup.cli

# Patches for local development
patches:
  # Override Keycloak URL for local development
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: jbpm-config
      data:
        KEYCLOAK_URL: "https://localhost:9443"
    target:
      kind: ConfigMap
      name: jbpm-config

  # Override Keycloak hostname for local development
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keycloak-config
      data:
        KC_HOSTNAME: localhost
    target:
      kind: ConfigMap
      name: keycloak-config

  # Override Ingress hosts for local development
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: jbpm-ingress
      spec:
        tls:
          - hosts:
              - localhost
            secretName: jbpm-tls
          - hosts:
              - localhost
            secretName: keycloak-tls
        rules:
          - host: localhost
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: jbpm
                      port:
                        number: 8080
          - host: localhost
            http:
              paths:
                - path: /auth
                  pathType: Prefix
                  backend:
                    service:
                      name: keycloak
                      port:
                        number: 9080
    target:
      kind: Ingress
      name: jbpm-ingress

  # Reduce resource requests for local development
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: StatefulSet
      name: postgres

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "384Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "768Mi"
    target:
      kind: StatefulSet
      name: keycloak

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1536Mi"
    target:
      kind: StatefulSet
      name: jbpm

  # Reduce PVC sizes for local development
  - patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "1Gi"
    target:
      kind: StatefulSet
      name: postgres

  - patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "1Gi"
      - op: replace
        path: /spec/volumeClaimTemplates/1/spec/resources/requests/storage
        value: "2Gi"
      - op: replace
        path: /spec/volumeClaimTemplates/2/spec/resources/requests/storage
        value: "1Gi"
    target:
      kind: StatefulSet
      name: jbpm
